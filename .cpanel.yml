---
deployment:
  tasks:
    - export REPOPATH="$(git rev-parse --show-toplevel)/"
    - export BRANCH="$(git -C "$REPOPATH" rev-parse --abbrev-ref HEAD)"
    - if [ "$BRANCH" = "main" ]; then export DEPLOYPATH=/home/mjrmstlj/ops.midwestmanagedit.com/; elif [ "$BRANCH" = "staging" ]; then export DEPLOYPATH=/home/mjrmstlj/ops-test.midwestmanagedit.com/; else echo "Refusing deployment from branch $BRANCH. Only main and staging are deployable."; exit 1; fi
    - /bin/rsync -rlptD --exclude=.git/ --exclude=.cpanel.yml --exclude=.gitignore --exclude=.env --exclude=.env.* --exclude=private/ --exclude=storage/ --exclude=uploads/ --exclude=logs/ --exclude=log/ --exclude=cache/ --exclude=tmp/ --exclude=backups/ --exclude=backup/ --exclude=error_log --exclude=*.log --exclude=*.zip --exclude=config.php --exclude=config.local.php --exclude=includes/private-config.php --exclude=includes/private-config.local.php "$REPOPATH" "$DEPLOYPATH"
